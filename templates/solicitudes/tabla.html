<div class="tabla-scroll"><table class="tabla-expedientes" aria-label="Listado de solicitudes"><thead><tr><th>Expediente</th><th>Convocatoria</th><th>Estado</th><th></th></tr></thead><tbody>{% for s in solicitudes %}<tr><td data-label="Expediente"><strong>BEC-{{ s.pk|stringformat:'05d' }}</strong>{% if es_personal %}<small>{{ s.nombre }}</small>{% endif %}</td><td data-label="Convocatoria">{{ s.convocatoria|default:'Expediente anterior' }}</td><td data-label="Estado"><span class="badge estado-{{ s.estado }}">{{ s.get_estado_display }}</span></td><td><a aria-label="Abrir expediente {{ s.pk }}"
   href="{% url 'solicitud_detalle' s.pk %}">Ver expediente ↗</a></td></tr>{% empty %}<tr><td colspan="4" class="vacio">No hay solicitudes para mostrar.</td></tr>{% endfor %}</tbody></table></div>
